name: Traffic telemetry

on:
  schedule:
    - cron: '0 9 * * *'   # daily 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-telemetry
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest traffic to PostHog
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
          TRAFFIC_PAT_LESSLY: ${{ secrets.TRAFFIC_PAT_LESSLY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: node scripts/ingest-traffic.mjs
